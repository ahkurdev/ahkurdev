name: Update GitHub Stats

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Generate GitHub Stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_border=true&title_color=02D9F7&icon_color=02D9F7&text_color=c9d1d9&bg_color=0d1117
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&title_color=02D9F7&text_color=02D9F7&bg_color=0d1117
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit generated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/*.svg
      git commit -m "Update GitHub stats" || exit 0
      git push
```
